<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{--bg:#F7F5F0;--surface:#FFFFFF;--ink:#233039;--muted:#6E7A82;--primary:#0E7C7B;--primary-d:#0B5E5D;--violet:#6D5AC0;--amber:#B4692B;--border:#E7E3DA;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Public Sans',system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
    h1,h2,h3{font-family:'Spectral',Georgia,serif;font-weight:600;margin:0;line-height:1.15;}
    a{color:var(--primary);text-decoration:none;} a:hover{color:var(--primary-d);}
    .phone{width:390px;min-height:844px;background:var(--bg);display:flex;flex-direction:column;}
    .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:12px;font-weight:600;font-size:16px;}
    .btn-primary{background:var(--primary);color:#fff;}
    .btn-ghost{background:transparent;color:var(--primary);border:1.5px solid var(--border);}
    .muted{color:var(--muted);}
  </style>
</helmet>
<div class="phone">
  <div style="flex:1;display:flex;flex-direction:column;padding:28px 22px;">
    <div style="display:flex;align-items:center;gap:9px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0E7C7B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c4-1 5-8 8-9s5 2 8-3"/><circle cx="4" cy="20" r="1.4" fill="#0E7C7B"/><circle cx="20" cy="8" r="1.4" fill="#0E7C7B"/></svg>
      <span style="font-family:'Spectral',Georgia,serif;font-weight:700;font-size:21px;letter-spacing:.3px;">Marg</span>
    </div>

    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px 0;">
      <div style="display:inline-flex;align-self:flex-start;gap:7px;align-items:center;font-size:12.5px;font-weight:600;color:var(--primary-d);background:#E3F0EF;padding:6px 11px;border-radius:999px;">For Class 10 · CBSE · Bengaluru</div>
      <h1 style="font-size:33px;">See all your paths after Class 10 — then choose, without being boxed in.</h1>
      <p class="muted" style="font-size:16px;line-height:1.55;margin:0;">A calm way to explore your real options and plan your next steps. No pressure, no verdicts.</p>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;">
      <div class="btn btn-primary">Start</div>
      <div class="btn btn-ghost">How this works</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;color:var(--muted);font-size:13px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6E7A82" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        We don't judge. Your answers stay private.
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
