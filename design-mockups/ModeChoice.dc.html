<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{--bg:#F7F5F0;--surface:#FFFFFF;--ink:#233039;--muted:#6E7A82;--primary:#0E7C7B;--primary-d:#0B5E5D;--violet:#6D5AC0;--amber:#B4692B;--border:#E7E3DA;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Public Sans',system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
    h1,h2,h3{font-family:'Spectral',Georgia,serif;font-weight:600;margin:0;line-height:1.18;}
    .phone{width:390px;min-height:760px;background:var(--bg);display:flex;flex-direction:column;padding:26px 22px;}
    .muted{color:var(--muted);}
    .choice{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 6px 20px rgba(20,40,50,.04);}
    .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
  </style>
</helmet>
<div class="phone">
  <div style="font-family:'Spectral',Georgia,serif;font-weight:700;font-size:19px;">Marg</div>
  <div style="margin-top:26px;display:flex;flex-direction:column;gap:8px;">
    <h1 style="font-size:27px;">How can I help today?</h1>
    <p class="muted" style="font-size:15px;line-height:1.5;margin:0;">Both are fine. You can switch anytime.</p>
  </div>

  <div style="margin-top:24px;display:flex;flex-direction:column;gap:16px;">
    <div class="choice">
      <div class="ic" style="background:#E3F0EF;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E7C7B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      </div>
      <div style="font-family:'Spectral',Georgia,serif;font-weight:600;font-size:19px;">I'm not sure yet</div>
      <div class="muted" style="font-size:14.5px;line-height:1.5;">Help me explore all my options and see what fits.</div>
    </div>

    <div class="choice">
      <div class="ic" style="background:#EEE9F8;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6D5AC0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </div>
      <div style="font-family:'Spectral',Georgia,serif;font-weight:600;font-size:19px;">I have a goal in mind</div>
      <div class="muted" style="font-size:14.5px;line-height:1.5;">Help me plan the next steps toward it.</div>
      <div style="margin-top:4px;display:flex;gap:7px;align-items:flex-start;color:var(--violet);font-size:12.5px;font-weight:600;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6D5AC0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px;"><path d="M12 8v4M12 16h.01"/><circle cx="12" cy="12" r="9"/></svg>
        <span>We'll take a quick look at it together first — no goal is set in stone.</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
